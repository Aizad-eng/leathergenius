<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zipper intro, production wiring | Leather Genius lab</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- 1. boot: decides before first paint whether the jacket covers the page (same snippet as README) -->
  <script>try{if(!sessionStorage.getItem('lg-zipper-done')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('lgz-pending');setTimeout(function(){document.documentElement.classList.remove('lgz-pending')},2600)}}catch(e){}</script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Bitter:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap">
  <link rel="stylesheet" href="/assets/site.css?v=17">
  <!-- 2. styles + early fetch of three.js -->
  <link rel="stylesheet" href="/assets/fx/zipper/module.css">
  <link rel="modulepreload" href="/assets/vendor/three/three.module.min.js">
  <style>
    html, body { margin: 0; height: 100%; }
    .lab-home { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #F6F2EA; }
    .lab-note { position: fixed; left: 16px; bottom: 16px; z-index: 5; margin: 0; background: #F6F2EA; border: 1px solid #d9cdb8; border-radius: 10px; padding: 8px 12px; font: 14px/1.3 Bitter, Georgia, serif; }
  </style>
</head>
<body>
  <iframe class="lab-home" src="/" title="Homepage"></iframe>
  <p class="lab-note">Plays once per visit. <a href="#" id="again">Clear and reload</a></p>
  <!-- 3. mount -->
  <script type="module">
    import '/assets/fx/zipper/module.js';
    LGFx.zipper.mount(document.body, { color: 'oxblood', metal: 'brass' });
  </script>
  <script>document.getElementById('again').onclick=function(e){e.preventDefault();try{sessionStorage.removeItem('lg-zipper-done')}catch(_){}location.reload()};</script>
</body>
</html>
